<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="stylesheet" href="css/leaflet.css">
    <link rel="stylesheet" href="css/L.Control.Layers.Tree.css">
    <link rel="stylesheet" href="css/L.Control.Locate.min.css">
    <link rel="stylesheet" href="css/qgis2web.css">
    <link rel="stylesheet" href="css/fontawesome-all.min.css">
    <link rel="stylesheet" href="css/leaflet.photon.css">
    <style>
      html, body, #map { width: 100%; height: 100%; padding: 0; margin: 0; }
    </style>
    <title></title>
  </head>
  <body>
    <div id="map"></div>

    <script src="js/qgis2web_expressions.js"></script>
    <script src="js/leaflet.js"></script>
    <script src="js/L.Control.Layers.Tree.min.js"></script>
    <script src="js/L.Control.Locate.min.js"></script>
    <script src="js/leaflet.rotatedMarker.js"></script>
    <script src="js/leaflet.pattern.js"></script>
    <script src="js/leaflet-hash.js"></script>
    <script src="js/Autolinker.min.js"></script>
    <script src="js/rbush.min.js"></script>
    <script src="js/labelgun.min.js"></script>
    <script src="js/labels.js"></script>
    <script src="js/leaflet.photon.js"></script>
    <script src="data/vw_wns_determination_3857_1.js"></script>

    <script>
      var highlightLayer;
      function highlightFeature(e) {
        highlightLayer = e.target;
        if (e.target.feature.geometry.type === 'LineString' || e.target.feature.geometry.type === 'MultiLineString') {
          highlightLayer.setStyle({ color: '#ffff00' });
        } else {
          highlightLayer.setStyle({ fillColor: '#ffff00', fillOpacity: 1 });
        }
      }

      // --- Map init (no min-zoom clamp now)
      var map = L.map('map', {
        zoomControl:false,
        maxZoom:7,
        minZoom:0,            // <-- allow zooming way out
        zoomSnap: 0.25,
        zoomDelta: 0.5
      }).fitBounds([[21.245309794070064,-127.24139703220385],[56.59285272956003,-53.58698082003675]]);
      var hash = new L.Hash(map);
      map.attributionControl.setPrefix('<a href="https://github.com/tomchadwin/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
      var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});

      // 3857 ⇄ WGS84 converters (define ONCE)
      const R_MERC = 6378137, DEG = 180/Math.PI;
      function mercToLon(x){ return (x / R_MERC) * DEG; }
      function mercToLat(y){ return (2 * Math.atan(Math.exp(y / R_MERC)) - Math.PI/2) * DEG; }
      function lonLatToMerc(lon, lat){
        const x = R_MERC * (lon * Math.PI/180);
        const y = R_MERC * Math.log(Math.tan(Math.PI/4 + (lat*Math.PI/180)/2));
        return {x,y};
      }

      var zoomControl = L.control.zoom({
        position: 'topleft',
        zoomDelta: 0.25
      }).addTo(map);
      L.control.locate({locateOptions: {maxZoom: 19}}).addTo(map);

      // Basemap
      map.createPane('pane_ESRIGraydark_0');
      map.getPane('pane_ESRIGraydark_0').style.zIndex = 400;
      var layer_ESRIGraydark_0 = L.tileLayer(
        'https://services.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}',
        { pane: 'pane_ESRIGraydark_0', opacity: 1.0, attribution: '', minZoom: 0, maxZoom: 7, minNativeZoom: 0, maxNativeZoom: 20, noWrap: true }
      ).addTo(map);

      // --- Right-click to copy coordinates (lat/lon + EPSG:3857)
      function toMercator(lat, lon) {
        const x = R_MERC * (lon * Math.PI / 180);
        const y = R_MERC * Math.log(Math.tan(Math.PI/4 + (lat * Math.PI / 180) / 2));
        return { x, y };
      }
      map.on('contextmenu', async (e) => {
        if (e.originalEvent) L.DomEvent.preventDefault(e.originalEvent);
        const { lat, lng } = e.latlng;
        const { x, y } = toMercator(lat, lng);
        const wgs84 = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
        const epsg3857 = `${Math.round(x)}, ${Math.round(y)}`;
        const text = `${wgs84}  |  ${epsg3857} (EPSG:3857)`;
        try { await navigator.clipboard.writeText(text); } catch (_) {}
        L.popup({ autoClose: true, closeButton: false, className: 'copy-popup' })
          .setLatLng(e.latlng)
          .setContent(`Copied: ${wgs84}`)
          .openOn(map);
        setTimeout(() => map.closePopup(), 1200);
      });

      // --- Restrict map view (PAN ONLY) to your 3857 box (no min-zoom here)
      const bnd_xMin = -14412939, bnd_yMax = 8283334;   // top-left (3857)
      const bnd_xMax =  -5599037, bnd_yMin = 2119137;   // bottom-right (3857)
      const maxBounds = [
        [mercToLat(bnd_yMin), mercToLon(bnd_xMin)], // SW
        [mercToLat(bnd_yMax), mercToLon(bnd_xMax)]  // NE
      ];
      map.setMaxBounds(maxBounds);
      map.options.maxBoundsViscosity = 1.0;
      layer_ESRIGraydark_0.setBounds && layer_ESRIGraydark_0.setBounds(maxBounds);

      // ---------- SVG overlay from 3857 world-file (with feather) ----------
      const A = 451.871045869391;
      const E = -451.876534588212;
      const C = -14582712.141659326851;
      const F =  8455113.259742163122;
      const width  = 19994;
      const height = 14137;

      const minX   = C - 0.5 * A;
      const maxXv  = C + A * (width  - 0.5);
      const northM = F - 0.5 * E;
      const southM = F + E * (height - 0.5);

      const svgBounds = [
        [mercToLat(southM), mercToLon(minX)],
        [mercToLat(northM), mercToLon(maxXv)]
      ];

      map.createPane('pane_SVG_Overlay');
      map.getPane('pane_SVG_Overlay').style.zIndex = 400;

      // Feathered image overlay helper (solution 3)
      let __featherId = 0;
      function featheredImageOverlay(url, bounds, pane='pane_SVG_Overlay', featherPct=2){
        const NS = 'http://www.w3.org/2000/svg';
        const svg = document.createElementNS(NS, 'svg');
        svg.setAttribute('viewBox', '0 0 100 100');
        svg.setAttribute('preserveAspectRatio', 'none');

        const defs = document.createElementNS(NS, 'defs');
        const mask = document.createElementNS(NS, 'mask');
        const maskId = 'edgeMask_' + (++__featherId);
        mask.setAttribute('id', maskId);

        // fully opaque base
        const base = document.createElementNS(NS, 'rect');
        base.setAttribute('x','0'); base.setAttribute('y','0');
        base.setAttribute('width','100'); base.setAttribute('height','100');
        base.setAttribute('fill','white');
        mask.appendChild(base);

        // transparent edge frame (feather width in % of box)
        const frame = document.createElementNS(NS, 'rect');
        frame.setAttribute('x','0'); frame.setAttribute('y','0');
        frame.setAttribute('width','100'); frame.setAttribute('height','100');
        frame.setAttribute('fill','none');
        frame.setAttribute('stroke','black');           // black = transparent in mask
        frame.setAttribute('stroke-width', String(featherPct * 50)); // 2% → ~1% per side
        frame.setAttribute('vector-effect','non-scaling-stroke');   // keep feather width constant
        mask.appendChild(frame);

        defs.appendChild(mask);
        svg.appendChild(defs);

        const img = document.createElementNS(NS, 'image');
        img.setAttributeNS('http://www.w3.org/1999/xlink','href', url);
        img.setAttribute('x','0'); img.setAttribute('y','0');
        img.setAttribute('width','100'); img.setAttribute('height','100');
        img.setAttribute('preserveAspectRatio','none');
        img.setAttribute('mask', `url(#${maskId})`);
        svg.appendChild(img);

        return L.svgOverlay(svg, bounds, { pane }).addTo(map);
      }

      // Use the feathered overlay instead of L.imageOverlay
      featheredImageOverlay('Layout%2018.svg', svgBounds, 'pane_SVG_Overlay', 2); // 2% feather; bump to 3–4 for softer

      // --- X overlays (helper + two examples)
      if (!map.getPane('pane_X')) {
        map.createPane('pane_X');
        map.getPane('pane_X').style.zIndex = 402; // above vectors if you want
      }
      function addX3857(x1, y1, x2, y2, {
        fill = '#000',
        stroke = '#fff',
        strokeWidth = 6,
        thicknessPct = 30,
        pane = 'pane_X'
      } = {}) {
        const SW = [mercToLat(y1), mercToLon(x1)];
        const NE = [mercToLat(y2), mercToLon(x2)];
        const bounds = [SW, NE];
        const NS = 'http://www.w3.org/2000/svg';
        const svg = document.createElementNS(NS, 'svg');
        svg.setAttribute('viewBox', '0 0 100 100');
        const t = thicknessPct / 2;
        const d = `M 0 ${50 - t} H ${50 - t} V 0 H ${50 + t} V ${50 - t} H 100 V ${50 + t} H ${50 + t} V 100 H ${50 - t} V ${50 + t} H 0 Z`;
        const path = document.createElementNS(NS, 'path');
        path.setAttribute('d', d);
        path.setAttribute('fill', fill);
        path.setAttribute('stroke', stroke);
        path.setAttribute('stroke-width', String(strokeWidth));
        path.setAttribute('stroke-linejoin', 'round');
        path.setAttribute('stroke-linecap', 'round');
        const g = document.createElementNS(NS, 'g');
        g.setAttribute('transform', 'rotate(45 50 50)');
        g.appendChild(path);
        svg.appendChild(g);
        return L.svgOverlay(svg, bounds, { pane }).addTo(map);
      }
      addX3857(-8345719, 5185358, -8220066, 5311801, { fill: '#fff', stroke: '#000', thicknessPct: 30, strokeWidth: 6 });
      addX3857(-13626581, 5959178, -13477207, 6068911, { fill: '#655ED5', stroke: '#fff', thicknessPct: 30, strokeWidth: 6 });

// --- Legend overlay (legend7.svg, moved up) ---
const legend_xMin = -7407574;   // new top-left X (EPSG:3857)
const legend_yMax =  5307433;   // new top-left Y

// pixel size in map units (same as before)
const legend_xSize =  451.871045869391;   // A
const legend_ySize = -451.876534588213;   // E (negative)

// NEW: intrinsic pixel dims of legend7.svg
const legend_imgW  = 1152;
const legend_imgH  = 2300;

// scale knob if you want it larger/smaller
const legend_scale = 2.8;  // try 3–5 as needed

// compute bottom-right
const legend_xMax = legend_xMin + legend_scale * legend_imgW * legend_xSize;
const legend_yMin = legend_yMax + legend_scale * legend_imgH * legend_ySize;

// build bounds [[south, west], [north, east]]
const legendBounds = [
  [mercToLat(legend_yMin), mercToLon(legend_xMin)],
  [mercToLat(legend_yMax), mercToLon(legend_xMax)]
];

// pane + overlay
if (!map.getPane('pane_legend')) {
  map.createPane('pane_legend');
  map.getPane('pane_legend').style.zIndex = 402;
}
L.imageOverlay('legend7.svg', legendBounds, {
  pane: 'pane_legend',
  opacity: 1
}).addTo(map);;


// ----------- counties layer ----------


// ----------- end counties layer -------------

      // --- Vector layer
      function removeEmptyRowsFromPopupContent(content, feature) {
        var tempDiv = document.createElement('div');
        tempDiv.innerHTML = content;
        var rows = tempDiv.querySelectorAll('tr');
        for (var i = 0; i < rows.length; i++) {
          var td = rows[i].querySelector('td.visible-with-data');
          var key = td ? td.id : '';
          if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
            rows[i].parentNode.removeChild(rows[i]);
          }
        }
        return tempDiv.innerHTML;
      }
      function addClassToPopupIfMedia(content, popup) {
        var tempDiv = document.createElement('div');
        tempDiv.innerHTML = content;
        if (tempDiv.querySelector('td img')) {
          popup._contentNode.classList.add('media');
          setTimeout(function(){ popup.update(); }, 10);
        } else {
          popup._contentNode.classList.remove('media');
        }
      }
      function pop_vw_wns_determination_3857_1(feature, layer) {
        layer.on({
          mouseout: function(e) {
            for (var i in e.target._eventParents) {
              if (typeof e.target._eventParents[i].resetStyle === 'function') {
                e.target._eventParents[i].resetStyle(e.target);
              }
            }
          },
          mouseover: highlightFeature,
        });
        var popupContent = '<table>\
          <tr><td colspan="2"><strong>county</strong><br />' + (feature.properties['county'] ?? '') + '</td></tr>\
          <tr><td colspan="2"><strong>stateprov</strong><br />' + (feature.properties['stateprov'] ?? '') + '</td></tr>\
          <tr><td colspan="2"><strong>determination</strong><br />' + (feature.properties['determination'] ?? '') + '</td></tr>\
          <tr><td colspan="2"><strong>determination_year</strong><br />' + (feature.properties['determination_year'] ?? '') + '</td></tr>\
        </table>';
        var content = removeEmptyRowsFromPopupContent(popupContent, feature);
        layer.on('popupopen', function(e) { addClassToPopupIfMedia(content, e.popup); });
        layer.bindPopup(content, { maxHeight: 400 });
      }
      function style_vw_wns_determination_3857_1_0() {
        return {
          pane: 'pane_vw_wns_determination_3857_1',
          opacity: 1,
          color: 'rgba(35,35,35,1.0)',
          dashArray: '',
          lineCap: 'butt',
          lineJoin: 'miter',
          weight: 1.0,
          fill: true,
          fillOpacity: 1,
          fillColor: 'rgba(243,166,178,0.0)',
          interactive: true
        }
      }
      map.createPane('pane_vw_wns_determination_3857_1');
      map.getPane('pane_vw_wns_determination_3857_1').style.zIndex = 401;
      map.getPane('pane_vw_wns_determination_3857_1').style['mix-blend-mode'] = 'normal';
      var layer_vw_wns_determination_3857_1 = new L.geoJson(json_vw_wns_determination_3857_1, {
        attribution: '',
        interactive: true,
        dataVar: 'json_vw_wns_determination_3857_1',
        layerName: 'layer_vw_wns_determination_3857_1',
        pane: 'pane_vw_wns_determination_3857_1',
        onEachFeature: pop_vw_wns_determination_3857_1,
        style: style_vw_wns_determination_3857_1_0,
      });
      map.addLayer(layer_vw_wns_determination_3857_1);

      // --- Cumulative outline preview slider (clears on release)
      const _feats = (json_vw_wns_determination_3857_1.features || [])
        .filter(f => f.properties && Number.isFinite(+f.properties.season_yr));
      const _years = Array.from(new Set(_feats.map(f => +f.properties.season_yr))).sort((a,b)=>a-b);

      if (!map.getPane('pane_vw_wns_outline')) {
        map.createPane('pane_vw_wns_outline');
        map.getPane('pane_vw_wns_outline').style.zIndex = 402;
      }
      const outlineLayer = L.geoJson(null, {
        pane: 'pane_vw_wns_outline',
        style: () => ({ color:'#fff', weight:3, opacity:1, fill:false, interactive:false })
      }).addTo(map);

      const outlineCtl = L.control({position:'topright'});
      outlineCtl.onAdd = function(){
        const d = L.DomUtil.create('div','leaflet-bar');
        d.style.background = '#fff';
        d.style.padding = '8px';
        d.style.minWidth = '240px';
        d.innerHTML = `
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
            <span>Through year</span> <b id="olYearLbl">—</b>
          </div>
          <input id="olYearSlider" type="range"
                 min="${_years[0]}" max="${_years.at(-1)}" step="1"
                 value="${_years[0]}" style="width:100%;">
        `;
        L.DomEvent.disableClickPropagation(d);
        return d;
      };
      outlineCtl.addTo(map);

      const olSlider = document.getElementById('olYearSlider');
      const olLabel  = document.getElementById('olYearLbl');

      function renderOutlineUpTo(y){
        const yr = +y;
        olLabel.textContent = `${_years[0]}–${yr}`;
        outlineLayer.clearLayers();
        outlineLayer.addData(_feats.filter(f => +f.properties.season_yr <= yr));
      }
      function clearOutline(){
        outlineLayer.clearLayers();
        olLabel.textContent = '—';
      }
      olSlider.addEventListener('input', e => renderOutlineUpTo(e.target.value));
      ['change','mouseup','pointerup','touchend','keyup','blur'].forEach(ev => {
        olSlider.addEventListener(ev, (e) => {
          if (e.type === 'keyup' && !['Enter','Escape',' '].includes(e.key)) return;
          clearOutline();
        });
      });

    </script>
  </body>
</html>
